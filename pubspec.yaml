name: veloce_vpn
description: Veloce VPN — Android client built with Flutter and Xray-core
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  shared_preferences: ^2.5.5
  provider: ^6.1.2
  url_launcher: ^6.3.0
  package_info_plus: ^10.2.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/licenses/AGPL-3.0.txt

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/app-icon.png"
  min_sdk_android: 24
  adaptive_icon_background: "#121316"
  adaptive_icon_foreground: "assets/images/app-icon-foreground.png"
